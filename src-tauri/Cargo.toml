[package]
name = "dev-sidecar-tauri"
version = "1.0.0"
description = "DevSidecar - 开发者边车加速工具 (Tauri + Rust 重构版)"
authors = ["dev-sidecar"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "dev_sidecar_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "compat"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# http stack
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "server-auto"] }
tower-service = "0.3"
bytes = "1"

# tls
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "logging"] }
rustls-native-certs = "0.7"
webpki-roots = "1"
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = "0.13"

# http client for DoH / remote config
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "charset", "http2"] }

# utilities
anyhow = "1"
regex = "1"
lru = "0.12"
rand = "0.8"
dirs = "5"
chrono = "0.4"
time = "0.3"
flate2 = "1"
parking_lot = "0.12"
once_cell = "1"
url = "2"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Networking_WinInet",
    # 直接枚举本机 ROOT 证书库，生成 npm cafile 所需的公共根证书 PEM
    "Win32_Security_Cryptography",
    # 广播 WM_SETTINGCHANGE，让资源管理器刷新环境变量块（否则新进程仍继承旧值）
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
